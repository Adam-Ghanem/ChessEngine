name: Frontend Quality

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "app/**"
      - ".github/workflows/frontend.yml"

jobs:
  production-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and product contracts
        run: pnpm test

      - name: TypeScript check
        run: pnpm run check

      - name: Production build
        run: pnpm run build:vercel

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ChessEngine test binary
        run: pnpm run build:engine

      - name: Unit tests
        run: pnpm test

      - name: TypeScript check
        run: pnpm run check

      - name: Accessibility checks
        run: |
          pnpm dev > /tmp/chessiq-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/play > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/chessiq-dev.log
            exit 1
          fi
          pnpm run test:accessibility

      - name: Production build
        run: pnpm run build:vercel
