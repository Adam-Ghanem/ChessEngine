name: Vendor openings snapshot

on:
  push:
    branches:
      - feature/openings-explorer-trainer
    paths:
      - .github/workflows/vendor-openings-snapshot.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/openings-explorer-trainer
          fetch-depth: 0

      - name: Vendor pinned CC0 Lichess opening data
        env:
          OPENINGS_SHA: 4b8622759e7ae6f93f011cc6c83a3823401ab45e
        run: |
          set -euo pipefail
          mkdir -p app/shared/openings/data
          for volume in a b c d e; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/lichess-org/chess-openings/${OPENINGS_SHA}/${volume}.tsv" \
              --output "app/shared/openings/data/${volume}.tsv"
          done
          cat > app/shared/openings/data/SOURCE.md <<EOF
          # Vendored opening data

          Source: lichess-org/chess-openings
          Snapshot commit: ${OPENINGS_SHA}
          License: CC0-1.0 / public-domain dedication
          Imported for factual ECO codes, opening names, and PGN move sequences.
          EOF

      - name: Commit vendored snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/shared/openings/data
          git diff --cached --quiet && exit 0
          git commit -m "data: vendor pinned CC0 opening catalog"
          git push origin HEAD:feature/openings-explorer-trainer
